name: Crear APK SpanishHub AI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Comprobar proyecto
        run: |
          test -f SpanishHubAI_APK_proyecto.zip
          mkdir -p source
          unzip -q SpanishHubAI_APK_proyecto.zip -d source
          test -f source/gradlew || test -f source/build.gradle || test -f source/build.gradle.kts || test -f source/settings.gradle || test -f source/settings.gradle.kts

      - name: Compilar APK
        run: |
          cd source
          /tmp/gradle-8.9/bin/gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SpanishHubAI-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
