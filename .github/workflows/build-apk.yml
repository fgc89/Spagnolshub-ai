 name: Crear APK SpanishHub AI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Comprobar ZIP del proyecto
        run: |
          set -e
          ZIP="SpanishHubAI_APK_proyecto.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::No se encuentra $ZIP en la raíz del repositorio."
            exit 1
          fi

          if [ ! -s "$ZIP" ]; then
            echo "::error::El ZIP está vacío."
            exit 1
          fi

          unzip -t "$ZIP"

          if ! unzip -Z1 "$ZIP" | grep -Eq '(^|/)app/build.gradle(\.kts)?$'; then
            echo "::error::Falta app/build.gradle o app/build.gradle.kts."
            exit 1
          fi

          if ! unzip -Z1 "$ZIP" | grep -Eq '(^|/)settings.gradle(\.kts)?$'; then
            echo "::error::Falta settings.gradle o settings.gradle.kts."
            exit 1
          fi

      - name: Extraer proyecto
        run: |
          mkdir -p source
          unzip -q SpanishHubAI_APK_proyecto.zip -d source

      - name: Restaurar caché de Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('source/**/*.gradle*', 'source/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
            - name: Cache
  uses: actions/cache@v5.1.0
  with:
    # A list of files, directories, and wildcard patterns to cache and restore
    path: 
    # An explicit key for restoring and saving the cache
    key: 
    # An ordered multiline string listing the prefix-matched keys, that are used for restoring stale cache if no cache hit occurred for key. Note `cache-hit` returns false in this case.
    restore-keys: # optional
    # The chunk size used to split up large files during upload, in bytes
    upload-chunk-size: # optional
    # An optional boolean when enabled, allows windows runners to save or restore caches that can be restored or saved respectively on other platforms
    enableCrossOsArchive: # optional, default is false
    # Fail the workflow if cache entry is not found
    fail-on-cache-miss: # optional, default is false
    # Check if a cache entry exists for the given input(s) (key, restore-keys) without downloading the cache
    lookup-only: # optional, default is false
    # Run the post step to save the cache even if another step before fails
    save-always: # optional, default is false

      - name: Compilar APK
        run: |
          cd source
          /tmp/gradle-8.9/bin/gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SpanishHubAI-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
